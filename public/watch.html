<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр видео</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .header .divider {
      color: #333;
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 2px;
    }
    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .error {
      text-align: center;
      color: #f55;
      font-size: 16px;
      padding: 40px;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>EBLA TUTA</h1>
      <div class="divider">──────────</div>
    </div>

    <div id="content">
      <p style="text-align:center; color:#888;">Загрузка...</p>
    </div>

    <div class="footer">
      Не передавай ссылку никому
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('v');

    const content = document.getElementById('content');

    if (!videoUrl) {
      content.innerHTML = '<p class="error">Видео не найдено</p>';
    } else {
      content.innerHTML = `
        <video controls autoplay playsinline>
          <source src="${videoUrl}" type="video/mp4">
          Твой браузер не поддерживает видео.
        </video>
      `;
    }
  </script>
</body>
</html>
